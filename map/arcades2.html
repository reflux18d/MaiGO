<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>舞萌机厅地图</title>
  <script src="https://webapi.amap.com/maps?v=2.0&key=e2af5ac6f39edf4b77e65f0774e0181d"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    html, body, #container {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    .info {
      font-size: 14px;
      line-height: 1.5;
    }
    .info a {
      color: #0077cc;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="container"></div>

<script>
  let pyBridge = null;

  // 建立 WebChannel 连接
  new QWebChannel(qt.webChannelTransport, function(channel) {
    pyBridge = channel.objects.pyBridge;
    console.log("✅ WebChannel connected:", pyBridge);
  });

  const map = new AMap.Map("container", {
    center: [116.310454, 39.992734],
    zoom: 11,
    viewMode: '2D',
    pitch: 45
  });

  // 加载机厅 JSON 数据
  fetch("all_arcades_code.json")
    .then(res => res.json())
    .then(data => {
      data.forEach(hall => {
        const marker = new AMap.Marker({
          position: [hall.lng, hall.lat],
          map: map,
          title: hall.name
        });

        // 使用一个 JS 函数来处理点击
        const infoContent = `
          <div class="info">
            <b>${hall.name}</b><br/>
            ${hall.address}<br/>
            <a onclick="handleClick(${hall.index})">就是这里!</a>
          </div>
        `;

        const infoWindow = new AMap.InfoWindow({
          content: infoContent,
          offset: new AMap.Pixel(0, -30)
        });

        marker.on("click", () => {
          infoWindow.open(map, marker.getPosition());
        });
      });
    })
    .catch(err => {
      console.error("❌ 加载 JSON 失败:", err);
    });

  // 统一处理点击事件
  function handleClick(index) {
    console.log("📍 点击 index =", index);
    if (pyBridge && typeof pyBridge.selected === "function") {
      pyBridge.selected(index);
    } else {
      console.warn("⚠️ pyBridge 未连接或 selected 不是函数");
    }
  }
</script>
</body>
</html>
